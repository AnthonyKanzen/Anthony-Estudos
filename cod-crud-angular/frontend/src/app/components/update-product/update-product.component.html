<mat-card>
  <mat-card-title>Alterar Produto</mat-card-title>

  <form>
    <mat-form-field>
      <input matInput placeholder="Nome" [(ngModel)]="product.name" name="name">
    </mat-form-field>

    <mat-form-field>
      <input matInput placeholder="Preço (R$)" [(ngModel)]="product.price" name="price">
    </mat-form-field>
  </form>

  <div class="buttons">
    <button mat-raised-button (click)="updateProduct()" class="update-button">
      Atualizar
    </button>

    <button mat-raised-button (click)="cancel()" class="cancel-button">
      Cancelar
    </button>
  </div>
</mat-card>
