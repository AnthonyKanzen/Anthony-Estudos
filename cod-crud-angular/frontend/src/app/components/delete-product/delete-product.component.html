<mat-card>
  <mat-card-title>Excluir Produto</mat-card-title>

  <form>
    <mat-form-field>
      <input matInput placeholder="Nome" [value]="product.name" name="name" readonly>
    </mat-form-field>

    <mat-form-field>
      <input matInput placeholder="Preço (R$)" [value]="product.price" name="price" readonly>
    </mat-form-field>
  </form>

  <div class="buttons">
    <button mat-raised-button (click)="deleteProduct()" class="delete-button">
      Excluir
    </button>

    <button mat-raised-button (click)="cancel()" class="cancel-button">
      Cancelar
    </button>
  </div>
</mat-card>
